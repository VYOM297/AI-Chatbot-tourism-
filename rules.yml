version: "3.1"

rules:

- rule: Greet the user and start the trip planning form
  condition:
  - active_loop: null
  steps:
  - intent: greet
  - action: utter_greet
  - action: trip_form
  - active_loop: trip_form

- rule: goodbye when no form is active
  condition:
  - active_loop: null
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: thank when no form is active
  condition:
  - active_loop: null
  steps:
  - intent: thank
  - action: utter_thank

- rule: ask_carbon_footprint when no form is active
