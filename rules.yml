  - active_loop: null

- rule: Submit the trip form, show results, and start booking
  condition:
  - active_loop: trip_form
  steps:
  - action: trip_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_calculate_carbon_footprint
  - action: action_recommend_options
  - action: booking_form
  - active_loop: booking_form

- rule: Submit booking form and confirm
  condition:
  - active_loop: booking_form
  steps:
  - action: booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_confirm_booking

- rule: Restart the conversation
  steps:
  - intent: restart
  - action: action_restart


