version: "3.1"

nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - hey
    - hii
    - hiya
    - good morning
    - good evening
    - hey there
    - hello there
    - yo
    - what's up
    - greetings
    - hy
    - hyy
    - hiii
    - hiiii
    - halo
    - hallo
    - hai
    - heyy
    - helo

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - that's all thanks
    - talk soon

- intent: affirm
  examples: |
    - yes
    - yeah
    - sure
    - that sounds good
    - correct
    - please do
    - ok
    - okay
    - alright
    - yep

- intent: deny
  examples: |
    - no
    - nope
    - not really
    - I don't want that

- intent: thank
  examples: |
    - thank you
    - thanks a lot
    - appreciate it
    - thanks for the help

- lookup: destination
  examples: |
    - Lisbon
    - Kyoto
    - Bali
    - Berlin
    - Costa Rica
    - Scotland
    - Iceland
    - Japan
